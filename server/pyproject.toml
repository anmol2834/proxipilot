[project]
name = "proxipilot-backend"
version = "0.1.0"
description = "High-Performance Multi-Tenant AI Email Automation Backend Infrastructure"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ProxiPilot Core Team", email = "engineering@proxipilot.com" }]
dependencies = [
    "fastapi>=0.115.0,<0.142",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "qdrant-client>=1.7.0,<1.10",  # code uses AsyncQdrantClient.search (removed in later clients)
    "openai>=1.30.0,<3.9",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
    "numpy>=1.26.0",
    "dnspython>=2.6.0",
    "email-validator>=2.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "xlwt>=1.3.0",
    "black>=24.4.0",
    "flake8>=7.0.0",
    "mypy>=1.10.0",
]

[tool.black]
line-length = 100
target-version = ['py311', 'py312', 'py313', 'py314']

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
